[project]
name = "gmod-docs"
version = "0.1.0"
description = "Documentation site for Garry's Mod add-ons."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mkdocs-material[imaging]==9.7.7",
]

[project.scripts]
build = "gmod_docs.tasks:build"
serve = "gmod_docs.tasks:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmod_docs"]
